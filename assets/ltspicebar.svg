<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 46" width="240" height="46" role="img" aria-label="LTspice — new to it">
  <defs>
    <style><![CDATA[
      :root { --panel: rgba(255,255,255,.70); --border: #16a34a33; --ink: #0f172a; --sub: #64748b; --track: #e6ebf5; }
      @media (prefers-color-scheme: dark) {
        :root { --panel: rgba(13,20,38,.66); --border: #16a34a55; --ink: #e8eefc; --sub: #93a6c4; --track: #18233c; }
      }
      text { font-family: 'Segoe UI', ui-sans-serif, system-ui, -apple-system, Roboto, sans-serif; }
      .name  { font-size: 13px; font-weight: 600; fill: var(--ink); }
      .state { font-size: 10px; font-weight: 800; fill: #16a34a; letter-spacing: 1px; text-transform: uppercase; }
      .panel { fill: var(--panel); stroke: var(--border); }
      .track { fill: var(--track); }
      .tick  { stroke: var(--panel); stroke-width: 2; }
      .fill  { transform-box: fill-box; transform-origin: left center;
                animation: grow 1.6s cubic-bezier(.22,1,.36,1) .2s both; }
      @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @media (prefers-reduced-motion: reduce) { .fill { animation: none; } }
    ]]></style>
